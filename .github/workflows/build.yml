name: Build and Deploy Stock Menu API

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: main
    concurrency:
      group: deploy-stockmenu-api-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Definir tags GHCR (owner em minúsculas)
        id: ghcr_image
        run: |
          NS=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tags<<EOF"
            echo "ghcr.io/${NS}/stockmenu-api:latest"
            echo "ghcr.io/${NS}/stockmenu-api:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.ghcr_image.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_DOMAIN: ${{ secrets.DOKPLOY_DEV_DOMAIN }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_DEV_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_DOMAIN}" ] || [ -z "${DOKPLOY_KEY}" ] || [ -z "${DOKPLOY_APP_ID}" ]; then
            echo "Secrets Dokploy incompletos. Imagem publicada no GHCR; deploy manual no painel."
            exit 0
          fi
          DOMAIN="${DOKPLOY_DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%%/*}"
          curl -fsS -X POST "https://${DOMAIN}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${DOKPLOY_KEY}" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
